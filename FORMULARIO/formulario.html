<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Pesquisa de Satisfação</title>
</head>
<body>

    <h1>Pesquisa de Satisfação</h1>
    <p>Sua opinião é muito importante para nós! Por favor, preencha o formulário abaixo.</p>

    <form action="#" method="post">

            <legend>Dados Pessoais</legend>

            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome_cliente" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email_cliente" required><br><br>

            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone_cliente"><br>

        <br>

            <legend>Pesquisa</legend>

            <p>1. Como você avalia a qualidade do nosso serviço?</p>
            <input type="radio" id="excelente" name="avaliacao_servico" value="excelente">
            <label for="excelente">Excelente</label><br>
            <input type="radio" id="bom" name="avaliacao_servico" value="bom">
            <label for="bom">Bom</label><br>
            <input type="radio" id="regular" name="avaliacao_servico" value="regular">
            <label for="regular">Regular</label><br>
            <input type="radio" id="ruim" name="avaliacao_servico" value="ruim">
            <label for="ruim">Ruim</label><br><br>

            <p>2. Você nos recomendaria a um amigo ou colega?</p>
            <input type="radio" id="recomenda_sim" name="recomendacao" value="sim">
            <label for="recomenda_sim">Sim</label><br>
            <input type="radio" id="recomenda_nao" name="recomendacao" value="nao">
            <label for="recomenda_nao">Não</label><br><br>

            <label for="como_conheceu">3. Como você ficou sabendo da nossa empresa?</label><br>
            <select id="como_conheceu" name="fonte_conhecimento">
                <option value="">Selecione uma opção</option>
                <option value="redes_sociais">Redes Sociais (Facebook, Instagram, etc.)</option>
                <option value="indicacao">Indicação de um amigo</option>
                <option value="pesquisa_google">Pesquisa no Google</option>
                <option value="anuncio">Anúncio online</option>
                <option value="outro">Outro</option>
            </select>
            <br><br><br>

            <input type="checkbox" id="autorizacao" name="autoriza_compartilhar" value="sim">
            <label for="autorizacao">Autorizo o compartilhamento da minha resposta com terceiros.</label>
            <br><br>

            <input type="submit" value="Enviar Pesquisa">

        </fieldset>
    </form>

</body>
</html>
